<title>자립 식물 앱 프로토타입</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: iPhone 15 Pro(393×852) 앱 화면. 넓은 화면은 폰 프레임 + 오른쪽 화면 목록, 좁은 화면은 앱이 화면을 채움.
   토큰은 Figma '10주_화면 수정' 값 그대로. 앱 디자인이 라이트 전용이라 단일 테마로 고정. */
:root {
  color-scheme: light;
  --app-bg: #FAFAFA; --page: #F7F8FA; --page-tint: #F1F4FD; --surface: #FFFFFF;
  --ink: #111317; --ink-strong: #1C1F24; --ink-2: #464C57; --ink-sub: #5C6370; --ink-muted: #A0A7B4; --ink-faint: #7A8291;
  --line: #C9CED8; --line-soft: #E3E6EC; --track: #EFF1F5; --chip: #ECEEF2;
  --primary: #3766FA; --primary-tint: #EFF4FF; --primary-tint-2: #DCE6FF; --primary-line: #91B6FF; --primary-deep: #1931DC; --primary-ink: #2145EF;
  --navy: #171D5B;
  --ok: #009837; --ok-bg: #E2FBEB; --ok-chip: #C9F7D8; --ok-ink: #06612A; --ok-bright: #39FF81; --ok-line: #00E954;
  --challenge-bg: #DCE6FF;
  --err: #E8483B; --err-bg: #FDE3E0;
  --naver: #00C73C; --kakao: #FDE40B; --google-bg: #F7F8FA;
  --stage: #E4E7EE; --stage-ink: #3B414C;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
.phone { word-break: keep-all; }
body { margin: 0; background: var(--stage); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
input, textarea { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.stage { min-height: 100%; display: flex; gap: 40px; align-items: center; justify-content: center; padding-block: 32px; flex-wrap: wrap; }

.phone-box { width: calc(393px * var(--s, 1)); height: calc(852px * var(--s, 1)); flex: none; position: sticky; top: 32px; align-self: flex-start; }
.phone { width: 393px; height: 852px; transform: scale(var(--s, 1)); transform-origin: top left; background: var(--app-bg); border-radius: 52px;
  position: relative; overflow: hidden; box-shadow: 0 0 0 10px #15171C, 0 30px 60px rgba(17,19,23,.25); isolation: isolate; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--app-bg); }
.view.tint { background: var(--page-tint); }
.view.page { background: var(--page); }
.status { height: 58px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 31px 0 51px; font-size: 17px; font-weight: 600; position: relative; z-index: 3; }
.status .island { position: absolute; left: 50%; top: 11px; transform: translateX(-50%); width: 125px; height: 37px; background: #000; border-radius: 100px; }
.status .lv { display: flex; gap: 7px; align-items: center; }
.status.light { color: #fff; } .status.light svg * { fill: #fff; stroke: #fff; }
.scroll { flex: 1; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; position: relative; }
.scroll::-webkit-scrollbar { display: none; }
.home-ind { height: 32px; flex: none; display: flex; align-items: center; justify-content: center; }
.home-ind i { width: 134px; height: 5px; border-radius: 100px; background: var(--ink); }
.home-ind.light i { background: #fff; }
.bottom { flex: none; padding: 16px 24px 0; }
.fade { animation: fade .26s ease both; }
.phone canvas.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
.phone.still .fade { animation: none; }
@keyframes fade { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .fade, .sheet, .scrim { animation: none !important; transition: none !important; } }

/* 헤더 */
.hdr { height: 64px; flex: none; display: grid; grid-template-columns: 64px 1fr 64px; align-items: center; background: var(--page); border-bottom: 1px solid var(--line-soft); position: relative; z-index: 2; }
.hdr h1 { margin: 0; text-align: center; font-size: 20px; line-height: 28px; font-weight: 600; color: var(--ink-strong); }
.hdr .left { justify-self: start; padding-left: 24px; }
.hdr .right { justify-self: end; padding-right: 24px; }
.hdr.title-left { grid-template-columns: 1fr 64px; }
.hdr.title-left h1 { text-align: left; padding-left: 24px; }
.iconbtn { width: 40px; height: 40px; border-radius: 9999px; display: grid; place-items: center; }
.iconbtn img { width: 40px; height: 40px; }
.plus { width: 40px; height: 40px; border-radius: 9999px; background: var(--primary); display: grid; place-items: center; box-shadow: 0 4px 8px rgba(55,102,250,.25); }
.textlink { white-space: nowrap; font-size: 14px; font-weight: 500; color: var(--ink-muted); }

/* 공통 컨트롤 */
.primary { width: 100%; height: 56px; border-radius: 9999px; background: var(--primary); color: #fff; font-size: 16px; font-weight: 600; box-shadow: 0 4px 8px rgba(0,0,0,.12); transition: opacity .15s, transform .1s; }
.primary:active { transform: scale(.985); }
.primary:disabled { opacity: .35; box-shadow: none; cursor: default; }
.secondary { height: 52px; border-radius: 9999px; background: var(--surface); border: 1px solid var(--line); font-size: 16px; font-weight: 600; color: var(--ink-strong); }
.danger { width: 100%; height: 56px; border-radius: 9999px; background: var(--err-bg); border: 1px solid var(--err); color: var(--err); font-size: 16px; font-weight: 600; }
.link-sub { display: block; margin: 16px auto 0; font-size: 16px; font-weight: 600; color: var(--ink-sub); }
.seg { display: flex; gap: 12px; }
.seg button { height: 34px; padding: 0 16px; border-radius: 9999px; font-size: 16px; font-weight: 600; background: var(--chip); color: var(--ink-sub); }
.seg.outline button { background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--primary); color: var(--primary-tint); border-color: var(--primary); }
.subseg { display: flex; gap: 12px; margin-top: 16px; }
.subseg button { height: 32px; padding: 0 16px; border-radius: 9999px; font-size: 14px; font-weight: 500; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
.subseg button[aria-pressed="true"] { background: var(--primary-tint); border-color: var(--primary); color: var(--primary-deep); }
.toggle { width: 52px; height: 28px; border-radius: 9999px; background: #D4D8E0; position: relative; flex: none; transition: background .15s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
.toggle[aria-checked="true"] { background: var(--primary); }
.toggle[aria-checked="true"]::after { transform: translateX(24px); }
.chips { display: flex; gap: 12px; flex-wrap: wrap; }
.chip { height: 32px; padding: 0 16px; border-radius: 9999px; border: 1px solid var(--line); background: var(--app-bg); font-size: 14px; font-weight: 500; color: var(--ink-2); }
.chip[aria-pressed="true"] { background: var(--primary-tint); border-color: var(--primary); color: var(--primary-deep); }
.day { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--app-bg); font-size: 14px; font-weight: 500; color: var(--ink-2); }
.day[aria-pressed="true"] { background: var(--primary-tint); border-color: var(--primary); color: var(--primary); }
.field-label { font-size: 14px; line-height: 22px; font-weight: 500; color: var(--ink); margin: 0 0 8px; display: block; }
.input { width: 100%; height: 50px; border-radius: 12px; border: 1px solid var(--line); background: var(--app-bg); padding: 0 20px; font-size: 16px; display: flex; align-items: center; gap: 12px; }
.input input { border: 0; background: none; width: 100%; height: 100%; outline: none; font-size: 16px; }
.input input::placeholder, textarea::placeholder { color: var(--ink-muted); }
.input.center input { text-align: center; }
.input svg { flex: none; }
.form { padding: 40px 24px 24px; display: grid; gap: 20px; }
.toast { position: absolute; left: 24px; right: 24px; bottom: 120px; z-index: 50; background: rgba(17,19,23,.92); color: #fff; border-radius: 12px; padding: 14px 16px; font-size: 14px; line-height: 22px; text-align: center; animation: fade .2s ease both; }

/* 시트 · 모달 · 메뉴 */
.scrim { position: absolute; inset: 0; z-index: 20; background: rgba(36,45,77,.35); animation: fade .2s ease both; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; background: rgba(242,244,248,.72); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border-top: 1px solid rgba(255,255,255,.7);
  border-radius: 24px 24px 0 0; padding: 20px 24px 0; box-shadow: 0 -8px 24px rgba(17,19,23,.08); animation: up .25s ease both; max-height: 88%; display: flex; flex-direction: column; }
@keyframes modal-in { from { opacity: .001; transform: translateY(calc(-50% + 6px)); } to { opacity: 1; transform: translateY(-50%); } }
@keyframes up { from { transform: translateY(40px); opacity: .001; } to { transform: none; opacity: 1; } }
.grab { width: 48px; height: 4px; border-radius: 4px; background: #8E95A3; margin: 0 auto 24px; flex: none; position: relative; }
.grab::before { content: ''; position: absolute; left: -150px; right: -150px; top: -20px; bottom: -16px; }
.sheet, .csheet { -webkit-user-select: none; user-select: none; } .sheet input, .sheet textarea { -webkit-user-select: text; user-select: text; }
.sheet { touch-action: pan-x; } .sheet .body { touch-action: pan-y; } .sheet .grab, .sheet > h2 { cursor: grab; }
.sheet.dragging { transition: none !important; }
.sheet h2 { margin: 0 0 20px; font-size: 20px; line-height: 28px; font-weight: 600; }
.sheet .body { overflow-y: auto; scrollbar-width: none; }
.modal { position: absolute; left: 28px; right: 28px; top: 50%; transform: translateY(-50%); z-index: 21; background: rgba(240,242,246,.98); border-radius: 20px; padding: 20px; animation: modal-in .2s ease both; text-align: center; box-shadow: 0 12px 30px rgba(17,19,23,.18); }
.modal h2 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; }
.modal p { margin: 4px 0 20px; font-size: 16px; color: var(--ink-sub); }
.menu { position: absolute; z-index: 22; min-width: 160px; background: rgba(214,226,255,.38); backdrop-filter: blur(10px) saturate(1.6); -webkit-backdrop-filter: blur(10px) saturate(1.6); border: 1px solid rgba(58,124,255,.16); border-radius: 20px; padding: 12px 20px; box-shadow: inset 0 4px 4px rgba(152,177,255,.16), 0 1px 5px rgba(55,102,250,.16); color: var(--ink); display: grid; gap: 4px; animation: fade .15s ease both; }
.menu button { display: flex; gap: 8px; align-items: center; height: 30px; font-size: 14px; text-align: left; }
.menu button .mi { width: 16px; height: 16px; display: grid; place-items: center; flex: none; } .menu button .mi img { max-width: 16px; max-height: 16px; }
.menu button.del { color: var(--err); }
.menu-catcher { position: absolute; inset: 0; z-index: 21; }
.ov-shown .sheet, .ov-shown .scrim, .ov-shown .modal, .ov-shown .menu { animation: none; }

/* 하단 탭 */
.tabbar { flex: none; padding: 16px 24px 0; }
.view > .tabbar { position: absolute; left: 0; right: 0; bottom: 32px; z-index: 6; pointer-events: none; padding-top: 0; }
.view > .tabbar nav { pointer-events: auto; }
.view > .tabbar + .home-ind { position: absolute; left: 0; right: 0; bottom: 0; z-index: 6; pointer-events: none; }
.view:has(> .tabbar) .scroll, .csheet .inner { padding-bottom: 116px; }
.tabbar nav { height: 64px; border-radius: 9999px; display: grid; grid-template-columns: repeat(4, 1fr); align-items: center; background: rgba(232,238,253,.62); border: 1px solid rgba(255,255,255,.8); backdrop-filter: blur(14px) saturate(1.8); -webkit-backdrop-filter: blur(14px) saturate(1.8); box-shadow: inset 0 1px 0 rgba(255,255,255,.9); }
.tabbar.glass nav { background: rgba(255,255,255,.4); border-color: rgba(255,255,255,.5); backdrop-filter: blur(20px) saturate(1.6); -webkit-backdrop-filter: blur(20px) saturate(1.6); }
.tabbar button { display: grid; place-items: center; height: 100%; }
.tabbar img { width: 28px; height: 28px; }

/* ===== A ===== */
.h1 { font-size: 28px; line-height: 40px; font-weight: 600; color: var(--ink); margin: 0; text-wrap: balance; }
.sub { font-size: 16px; line-height: 24px; color: var(--ink-sub); margin: 0; }
.view.splash-v { background: var(--primary); }
.splash-art { position: absolute; left: calc(50% - 116px); top: calc(51.64% - 111px); width: 232px; height: 222px; animation: sp-shrink .7s cubic-bezier(.3,.7,.2,1) 1.6s both; }
.splash-art img { position: absolute; inset: 0; width: 100%; height: 100%; }
.splash-art .lg { animation: sp-rise .7s cubic-bezier(.22,.8,.3,1) .15s both; }
.splash-art .lw { animation: sp-rise .7s cubic-bezier(.22,.8,.3,1) .7s both; }
.splash-copy { position: absolute; left: 0; right: 0; top: calc(51.64% + 32px); text-align: center; color: #F7F8FA; animation: sp-rise .6s cubic-bezier(.22,.8,.3,1) 1.95s both; }
.splash-copy .wordmark { display: block; height: 40px; width: auto; margin: 0 auto; }
.splash-copy span { display: block; margin-top: 12px; font-size: 16px; line-height: 24px; color: #DAE5FF; }
@keyframes sp-rise { from { opacity: 0; transform: translateY(28px); } 60% { opacity: 1; } to { opacity: 1; transform: none; } }
@keyframes sp-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes sp-shrink { to { transform: translateY(-59px) scale(.517); } }
@media (prefers-reduced-motion: reduce) { .splash-art, .splash-art img, .splash-copy { animation-duration: .01s !important; animation-delay: 0s !important; } }
.login-top { display: flex; flex-direction: column; align-items: center; text-align: center; flex: none; }
/* 높이가 852보다 작은 휴대폰에서도 스크롤 없이: 디자인 여백(91·90)을 같은 비율로 줄여요 */
.fit-col { display: flex; flex-direction: column; } .fit-col > * { flex-shrink: 0; }
.fit-sp { flex: 0 1 0; min-height: 12px; }
.fit-col > .fit-sp { flex-shrink: 1; flex-basis: 0; }
.login-top img { width: 159px; height: 142px; }
.sprout-pop { transform-origin: 50% 98%; animation: sprout-pop 1s cubic-bezier(.3,.9,.35,1) .2s both; }
.phone.still .sprout-pop { animation: none; }
@keyframes sprout-pop { 0% { opacity: 0; transform: translateY(14px) scale(.35, .2); } 35% { opacity: 1; } 55% { transform: translateY(-4px) scale(.96, 1.1); } 75% { transform: translateY(0) scale(1.04, .97); } 100% { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .sprout-pop { animation: none; } }
.err { margin: 0 24px; height: 52px; border-radius: 12px; background: var(--err-bg); color: var(--err); display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 14px; font-weight: 500; }
.err img { width: 20px; height: 20px; } .err span { flex: 1; } .err button { color: var(--err); font-weight: 500; }
.socials { display: grid; gap: 12px; padding: 34px 24px 0; }
.social { height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 12px; font-size: 16px; font-weight: 600; }
.social.naver { background: var(--naver); color: #F7F8FA; } .social.kakao { background: var(--kakao); color: var(--ink); }
.social.google { background: var(--google-bg); color: var(--ink); border: 1px solid var(--line); } .social.google img { width: 24px; height: 24px; }
.social[aria-busy="true"] { opacity: .6; pointer-events: none; }
.consent { display: flex; align-items: center; justify-content: center; gap: 12px; margin-top: 20px; font-size: 14px; color: var(--ink-muted); }
.check { width: 24px; height: 24px; border-radius: 6px; border: 1.2px solid var(--line); display: grid; place-items: center; background: var(--surface); }
.check[aria-checked="true"] { background: var(--primary); border-color: var(--primary); }
.check svg { opacity: 0; } .check[aria-checked="true"] svg { opacity: 1; }
.guide { margin-top: 40px; border-radius: 12px; background: var(--primary-tint); border: 1px solid var(--primary-line); padding: 21px; display: grid; gap: 12px; }
.guide div { display: flex; align-items: center; gap: 12px; font-size: 14px; line-height: 22px; } .guide img { width: 20px; height: 20px; object-fit: contain; } .guide b { font-weight: 600; color: var(--primary); }
.qtop { flex: none; padding: 0 24px; }
.qtop .row { height: 24px; display: grid; grid-template-columns: 24px 1fr 24px; align-items: center; }
.qtop .count { text-align: center; font-size: 16px; font-weight: 600; color: var(--ink-sub); font-variant-numeric: tabular-nums; } .qtop .count em { font-style: normal; color: var(--primary); }
.track { margin-top: 16px; height: 8px; border-radius: 999px; background: var(--track); overflow: hidden; }
.track i { display: block; height: 100%; border-radius: 999px; background: var(--primary); transition: width .3s ease; }
.opt { display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; min-height: 56px; padding: 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--app-bg); font-size: 16px; line-height: 24px; }
.opt .radio { flex: none; width: 20px; height: 20px; border-radius: 9999px; border: 1.6px solid var(--line); display: grid; place-items: center; }
.opt .radio i { width: 10px; height: 10px; border-radius: 9999px; background: var(--primary); transform: scale(0); transition: transform .15s; }
.opt[aria-checked="true"] { background: var(--primary-tint); border-color: var(--primary); font-weight: 600; }
.opt[aria-checked="true"] .radio { border-color: var(--primary); } .opt[aria-checked="true"] .radio i { transform: scale(1); }
.result { padding: 40px 24px 32px; text-align: center; }
.traits { margin-top: 40px; text-align: left; border-radius: 20px; background: var(--primary-tint); border: 1px solid var(--primary); padding: 25px; }
.traits h3 { margin: 0; font-size: 20px; line-height: 28px; font-weight: 600; color: #1B29B2; }
.traits ul { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 12px; }
.traits li { display: flex; gap: 12px; align-items: center; font-size: 16px; line-height: 24px; color: #1B29B2; } .traits li img { width: 24px; height: 22px; }
.block { padding: 5px 20px; text-align: left; } .block h4 { margin: 0; font-size: 16px; font-weight: 600; } .block p { margin: 12px 0 0; font-size: 16px; line-height: 24px; }
.divider { height: 1px; background: var(--line); margin: 16px 0; }
.basis { margin-top: 36px; text-align: left; border-radius: 12px; background: #D5FFE5; border: 1px solid var(--ok-line); padding: 17px 25px; color: #003714; }
.basis h4 { margin: 0; font-size: 16px; font-weight: 600; } .basis p { margin: 4px 0 0; font-size: 16px; line-height: 24px; }
.basis ul { margin: 8px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; line-height: 22px; } .basis li b { margin-right: 6px; }

.grow { position: relative; display: block; width: 240px; height: 200px; margin: 16px auto 0; }
.grow img { position: absolute; left: 50%; bottom: 0; max-width: none; opacity: 0; transform: scale(.88) translateY(10px); transform-origin: 50% 100%; transition: opacity .6s ease, transform .75s cubic-bezier(.22,.8,.3,1); }
.grow img.on { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .grow img { transition: none; } }
.petals { position: absolute; top: 0; left: 0; width: 393px; height: 852px; transform: scale(var(--s, 1)); transform-origin: top left; border-radius: 52px; overflow: hidden; pointer-events: none; z-index: 5; }
.petals[hidden] { display: none; }
.petals .pf { position: absolute; top: 0; animation: pf-fall linear infinite; will-change: transform; }
.petals .pf i { display: block; animation: pf-sway ease-in-out infinite alternate; }
.petals .pf svg { display: block; animation: pf-flip linear infinite; }
@keyframes pf-fall { from { transform: translate3d(0, -40px, 0); } to { transform: translate3d(var(--dx), 900px, 0); } }
@keyframes pf-sway { from { transform: translateX(calc(var(--sw) * -1)) rotate(-25deg); } to { transform: translateX(var(--sw)) rotate(35deg); } }
@keyframes pf-flip { from { transform: rotate3d(1, .4, 0, 0deg); } to { transform: rotate3d(1, .4, 0, 360deg); } }
@media (prefers-reduced-motion: reduce) { .petals { display: none; } }
/* ===== B 홈 (11주) ===== */
.home2 { background: var(--page); }
.home2 .status { background: var(--navy); color: #fff; }
.status:has(+ .hdr), .status:has(+ div > .hdr:first-child) { background: var(--page); }
.hero { background: var(--navy); border-radius: 0 0 20px 20px; padding: 58px 0 32px; color: #fff; }
.hero .hhdr { height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; margin-top: 4px; }
.hero .name { display: flex; gap: 16px; align-items: center; font-size: 24px; font-weight: 600; }

function scoreType() { const c = [0, 0, 0, 0]; S.answers.forEach(a => { if (a !== null) c[a]++; }); const max = Math.max(...c); const tied = c.map((v, k) => v === max ? k : -1).filter(k => k >= 0); tied.sort((x, y) => S.answers.indexOf(x) - S.answers.indexOf(y)); return tied[0]; }
SCREENS.result = (p) => { const t = p.t ?? S.type, T = TYPES[t]; const picked = S.answers.map((a, i) => ({ a, i })).filter(x => x.a === t); const all = S.answers.every(a => a !== null);

// B 홈
const todayTodos = () => S.todos.filter(t => t.date === TODAY);

SCREENS.home = () => { const tt = todayTodos(), dn = tt.filter(t => t.done).length, m = S.mission; const mDone = m.done ? 1 : 0; const pct = (mDone + dn) / (1 + tt.length) * 100;

  ${missionHtml}
  <div class="sec-hd" style="margin-top:${m.pick === null ? 40 : 44}px"><h2>오늘의 일정 ${dn} / ${tt.length}</h2><button type="button" class="pill-b" data-act="todo-all">전체보기 ${I.chev('#EFF4FF')}</button></div>

const calHtml = (opts = {}) => { const rows = []; const first = 2; // 12월 1일 = 화
